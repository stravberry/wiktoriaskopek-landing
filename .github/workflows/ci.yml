# Kontrola każdego PR i main: lint (app/, lib/, components/mf/), typy, testy. Uzgodnione z Coding Builderem 26.11.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      # Układ na telefonie i komputerze: 320–1280 px bez overflow, uciętych słów, małych celów dotyku (tests-e2e/).
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:layout
        env:
          CI: "true"
